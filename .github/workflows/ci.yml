name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Build and run the unit tests with coverage
        run: |
          cmake -S . -B build-coverage -DREBOARD_BUILD_UI=OFF -DREBOARD_BUILD_TESTS=ON -DREBOARD_COVERAGE=ON
          cmake --build build-coverage -j"$(nproc)"
          ctest --test-dir build-coverage --output-on-failure

      - name: Coverage report
        run: gcovr --root . --filter 'src/' --exclude 'tests/' --print-summary

  build:
    name: Build for ${{ matrix.device }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [rm1, rm2, ferrari]
    steps:
      - uses: actions/checkout@v4

      - name: Cache the official reMarkable SDK installer
        uses: actions/cache@v4
        with:
          path: .sdk-cache
          key: remarkable-sdk-installer-${{ matrix.device }}-3.27.0.97

      - name: Download and install the official reMarkable SDK
        run: make sdk-${{ matrix.device }}

      - name: Cross-compile reBoard
        run: make cross-${{ matrix.device }}

      - name: Stage the distribution files
        run: |
          mkdir -p dist/reboard-${{ matrix.device }}
          cp build-${{ matrix.device }}/src/reboard build-${{ matrix.device }}/src/reboard-ui dist/reboard-${{ matrix.device }}/
          cp -r packaging dist/reboard-${{ matrix.device }}/

      - name: Upload the device binary as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: reboard-${{ matrix.device }}
          path: dist/reboard-${{ matrix.device }}
          if-no-files-found: error

  release:
    name: Publish the rolling release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download all device artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package the release assets
        run: |
          cd dist
          for directory in reboard-*; do
            zip -r "${directory}.zip" "${directory}"
          done

      # A single rolling "latest" release always points at the newest main
      # build. Delete and recreate it so the tag follows the current commit.
      - name: Update the "latest" release
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" || true
          gh release create latest dist/reboard-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (main)" \
            --notes "Automated build of commit $GITHUB_SHA. One zip per device: rm1 = reMarkable 1, rm2 = reMarkable 2, ferrari = reMarkable Paper Pro. Each zip contains the launcher binary plus the systemd unit and an example application manifest."
